<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drone Georef Prototype</title>
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <header class="app-header">
        <div>
          <p class="eyebrow">F-Field Prototype</p>
          <h1>드론사진 맞춤 오버레이</h1>
        </div>
      </header>

      <section class="panel">
        <label class="file-pick">
          <input id="photo-input" type="file" accept="image/*">
          <span>드론사진 선택</span>
        </label>
        <div id="image-meta" class="meta">사진을 선택하면 지도 위에 표시됩니다.</div>
      </section>

      <section class="panel">
        <div class="panel-title">표시</div>
        <label class="control-row">
          <span>투명도</span>
          <input id="opacity-input" type="range" min="0.1" max="1" value="0.72" step="0.02">
        </label>
        <label class="check-row">
          <input id="visible-input" type="checkbox" checked>
          <span>사진 보이기</span>
        </label>
      </section>

      <section class="panel">
        <div class="panel-title">수동 배치</div>
        <label class="control-row">
          <span>크기</span>
          <input id="scale-input" type="range" min="0.04" max="2.4" value="0.25" step="0.01">
        </label>
        <label class="control-row">
          <span>회전</span>
          <input id="rotation-input" type="range" min="-180" max="180" value="0" step="1">
        </label>
        <div class="hint">기준점이 1개일 때만 적용됩니다. 2개 이상부터는 기준점으로 자동 계산합니다.</div>
      </section>

      <section class="panel">
        <div class="panel-title">기준점</div>
        <div class="mode-grid">
          <button id="pick-image-btn" type="button" class="mode-btn">사진 지점</button>
          <button id="pick-map-btn" type="button" class="mode-btn">지도 지점</button>
        </div>
        <div id="mode-help" class="meta">사진 지점을 먼저 찍고, 같은 위치를 지도에서 찍으세요.</div>
        <div id="point-list" class="point-list"></div>
        <div class="button-row">
          <button id="clear-points-btn" type="button" class="ghost-btn">기준점 초기화</button>
          <button id="fit-btn" type="button" class="ghost-btn">사진 위치로 이동</button>
        </div>
      </section>

      <section class="panel">
        <div class="panel-title">저장 테스트</div>
        <div id="transform-summary" class="summary">변환 대기 중</div>
        <button id="copy-json-btn" type="button" class="primary-btn">JSON 복사</button>
      </section>
    </aside>

    <main class="map-wrap">
      <div id="map"></div>
      <div class="status-bar">
        <span id="status-text">이미지를 선택하세요.</span>
      </div>
    </main>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
